<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claro Turnos — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   CLARO TURNOS — Prototipo funcional
   Estado compartido persistente vía window.storage (simula backend real-time)
   ========================================================================= */

const SERVICIOS = [
  { id:'A', nombre:'Ventas', icon: iconTag },
  { id:'B', nombre:'Servicio al Cliente', icon: iconHeadset },
  { id:'C', nombre:'Soporte Técnico', icon: iconWrench },
  { id:'D', nombre:'Facturación', icon: iconInvoice },
  { id:'E', nombre:'Reclamos', icon: iconFlag },
];
const SUCURSAL = 'Sucursal Principal';
const STATE_KEY = 'claro_turnos_estado';
const AGENTS_KEY = 'claro_turnos_agentes';

let state = { counters:{A:0,B:0,C:0,D:0,E:0}, tickets:[], calledLog:[] };
let agents = [
  { id:1, nombre:'María Fernández', usuario:'mfernandez', servicios:['A','D'] },
  { id:2, nombre:'Carlos Rojas', usuario:'crojas', servicios:['B','C','E'] },
];
let session = null; // {agentId, nombre, ventanilla}
let currentView = 'kiosco';
let lastCalledSeen = 0;

const root = document.getElementById('app');

/* ---------------------- storage helpers ---------------------- */
async function loadState(){
  try{
    const r = await window.storage.get(STATE_KEY, true);
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){ /* no existe aún */ }
  try{
    const r2 = await window.storage.get(AGENTS_KEY, true);
    if(r2 && r2.value) agents = JSON.parse(r2.value);
  }catch(e){ /* usa default */ }
}
async function saveState(){
  try{ await window.storage.set(STATE_KEY, JSON.stringify(state), true); }catch(e){ console.error(e); }
}
async function saveAgents(){
  try{ await window.storage.set(AGENTS_KEY, JSON.stringify(agents), true); }catch(e){ console.error(e); }
}

/* ---------------------- business logic ---------------------- */
function svcOf(id){ return SERVICIOS.find(s=>s.id===id); }

function generarTicket(servicioId){
  state.counters[servicioId] = (state.counters[servicioId]||0) + 1;
  const codigo = `${servicioId}-${String(state.counters[servicioId]).padStart(3,'0')}`;
  const ticket = {
    id: codigo + '-' + Date.now(),
    codigo, servicioId,
    estado:'esperando',
    createdAt: Date.now(),
    calledAt:null, finishedAt:null,
    ventanilla:null, agente:null, veces:0,
  };
  state.tickets.push(ticket);
  return ticket;
}
function personasEnEspera(servicioId){
  return state.tickets.filter(t=>t.servicioId===servicioId && t.estado==='esperando').length;
}
function siguienteEnEspera(serviciosIds){
  return state.tickets
    .filter(t=>t.estado==='esperando' && serviciosIds.includes(t.servicioId))
    .sort((a,b)=>a.createdAt-b.createdAt)[0];
}
function tiempoPromedio(servicioId, campoInicio, campoFin){
  const arr = state.tickets.filter(t=>t.servicioId===servicioId && t[campoInicio] && t[campoFin]);
  if(!arr.length) return 0;
  const total = arr.reduce((s,t)=> s + (t[campoFin]-t[campoInicio]), 0);
  return (total/arr.length)/60000; // minutos
}

/* ---------------------- render root ---------------------- */
function render(){
  if(currentView === 'kiosco') return renderKiosco();
  if(currentView === 'publica') return renderPublica();
  root.innerHTML = `
    <div class="rail">
      <div class="brand">C</div>
      ${navBtn('recepcion', iconGrid(), 'Recepción')}
      ${navBtn('agentes', iconUser(), 'Agentes')}
      ${navBtn('publica', iconScreen(), 'Público')}
      ${navBtn('admin', iconCog(), 'Admin')}
      ${navBtn('kiosco', iconKiosk(), 'Kiosco')}
    </div>
    <div class="main">
      <div class="topbar">
        <div><h1>${labelFor(currentView)}</h1><div class="sub">${SUCURSAL}</div></div>
        <div class="clock" id="clockTop"></div>
      </div>
      <div class="view" id="viewBody"></div>
    </div>
  `;
  document.querySelectorAll('.rail button[data-view]').forEach(b=>{
    b.onclick = ()=>{ currentView = b.dataset.view; render(); };
  });
  tickClock('clockTop');
  const body = document.getElementById('viewBody');
  if(currentView==='recepcion') body.innerHTML = recepcionHtml();
  if(currentView==='agentes') renderAgentes(body);
  if(currentView==='admin') renderAdmin(body);
}
function navBtn(view, svg, label){
  return `<button data-view="${view}" class="${currentView===view?'active':''}">${svg}${label}</button>`;
}
function labelFor(v){
  return {recepcion:'Panel de Recepción', agentes:'Panel de Agentes', admin:'Módulo Administrativo'}[v] || '';
}
function tickClock(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = new Date().toLocaleString('es', {dateStyle:'medium', timeStyle:'medium'});
}

/* ---------------------- KIOSCO ---------------------- */
function renderKiosco(){
  root.innerHTML = `
    <div class="kiosco">
      <button class="btn ghost sm kiosco-exit" id="exitKiosco">Salir del kiosco</button>
      <div id="kioscoBody"></div>
    </div>`;
  document.getElementById('exitKiosco').onclick = ()=>{ currentView='recepcion'; render(); };
  paintKioscoWelcome();
}
function paintKioscoWelcome(){
  const body = document.getElementById('kioscoBody');
  body.innerHTML = `
    <div class="kiosco-logo"><div class="mark">C</div><span>claro</span></div>
    <h2>Bienvenido — seleccione el tipo de atención</h2>
    <div class="svc-grid">
      ${SERVICIOS.map(s=>`
        <button class="svc-btn" data-id="${s.id}">
          <span class="icon">${s.icon()}</span>${s.nombre}
        </button>`).join('')}
    </div>
  `;
  body.querySelectorAll('.svc-btn').forEach(b=>{
    b.onclick = async ()=>{
      const t = generarTicket(b.dataset.id);
      await saveState();
      paintKioscoReceipt(t);
    };
  });
}
function paintKioscoReceipt(t){
  const body = document.getElementById('kioscoBody');
  const svc = svcOf(t.servicioId);
  const espera = personasEnEspera(t.servicioId) - 1;
  body.innerHTML = `
    <div class="receipt-wrap">
      <div class="receipt">
        <div class="rlogo">CLARO</div>
        <div class="rcode">${t.codigo}</div>
        <div class="rsvc">${svc.nombre}</div>
        <div class="rline"></div>
        <div class="rmeta"><span>${new Date(t.createdAt).toLocaleDateString('es')}</span><span>${new Date(t.createdAt).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:true})}</span></div>
        <div class="rwait">Clientes en espera delante de usted: <strong>${Math.max(espera,0)}</strong></div>
        <div class="rline"></div>
        <div class="rwelcome">Gracias por preferir Claro<br/>Conserve este ticket</div>
        <div class="rbarcode"></div>
      </div>
    </div>
    <div class="kiosco-countdown">Volviendo al inicio en unos segundos…</div>
  `;
  setTimeout(()=>{ if(currentView==='kiosco') paintKioscoWelcome(); }, 6000);
}

/* ---------------------- RECEPCIÓN ---------------------- */
function recepcionHtml(){
  const rows = SERVICIOS.map(s=>{
    const espera = personasEnEspera(s.id);
    const tWait = tiempoPromedio(s.id,'createdAt','calledAt');
    const tAttend = tiempoPromedio(s.id,'calledAt','finishedAt');
    return `<tr>
      <td><strong>${s.id}</strong> — ${s.nombre}</td>
      <td><span class="badge wait"><span class="dot"></span>${espera} en espera</span></td>
      <td>${tWait? tWait.toFixed(1)+' min':'—'}</td>
      <td>${tAttend? tAttend.toFixed(1)+' min':'—'}</td>
    </tr>`;
  }).join('');

  const ticketsOrdenados = [...state.tickets].sort((a,b)=>b.createdAt-a.createdAt).slice(0,40);
  const trows = ticketsOrdenados.map(t=>`
    <tr>
      <td class="mono">${t.codigo}</td>
      <td>${svcOf(t.servicioId).nombre}</td>
      <td>${estadoBadge(t.estado)}</td>
      <td>${t.ventanilla? 'Ventanilla '+t.ventanilla : '—'}</td>
      <td>${new Date(t.createdAt).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</td>
    </tr>`).join('') || `<tr><td colspan="5" class="empty">Aún no se han generado turnos</td></tr>`;

  return `
    <div class="section-title">Colas por servicio</div>
    <div class="card"><table><thead><tr><th>Servicio</th><th>En espera</th><th>T. prom. espera</th><th>T. prom. atención</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="section-title">Tickets del día</div>
    <div class="card"><table><thead><tr><th>Código</th><th>Servicio</th><th>Estado</th><th>Ventanilla</th><th>Hora</th></tr></thead><tbody>${trows}</tbody></table></div>
  `;
}
function estadoBadge(e){
  const map = {
    esperando:['wait','Esperando'], en_atencion:['attend','En atención'],
    atendido:['done','Atendido'], cancelado:['cancel','Cancelado'], ausente:['cancel','Ausente'],
  };
  const [cls,label] = map[e] || ['done', e];
  return `<span class="badge ${cls}"><span class="dot"></span>${label}</span>`;
}

/* ---------------------- AGENTES ---------------------- */
function renderAgentes(body){
  if(!session){
    body.innerHTML = `
      <div class="card" style="max-width:380px;padding:22px;">
        <div class="section-title" style="margin-top:0;">Ingreso de agente</div>
        <label>Agente</label>
        <select id="selAgente">${agents.map(a=>`<option value="${a.id}">${a.nombre}</option>`).join('')}</select>
        <div style="height:12px;"></div>
        <label>Ventanilla</label>
        <input type="number" id="inpVentanilla" value="1" min="1" />
        <div style="height:16px;"></div>
        <button class="btn primary" id="btnLogin" style="width:100%;">Iniciar sesión</button>
      </div>`;
    document.getElementById('btnLogin').onclick = ()=>{
      const a = agents.find(x=>x.id==document.getElementById('selAgente').value);
      const vent = Number(document.getElementById('inpVentanilla').value)||1;
      session = { agentId:a.id, nombre:a.nombre, ventanilla:vent, servicios:a.servicios };
      body.parentElement.querySelector('.sub').textContent = `${SUCURSAL} · ${a.nombre} · Ventanilla ${vent}`;
      renderAgentes(body);
    };
    return;
  }

  const actual = state.tickets.find(t=> t.estado==='en_atencion' && t.agente===session.agentId);
  body.innerHTML = `
    <div class="card" style="padding:20px;max-width:520px;">
      <div class="section-title" style="margin-top:0;">${session.nombre} — Ventanilla ${session.ventanilla}</div>
      ${actual
        ? `<div style="font-size:15px;margin-bottom:14px;">Atendiendo: <span class="mono" style="font-weight:800;font-size:20px;">${actual.codigo}</span> — ${svcOf(actual.servicioId).nombre}</div>
           <div style="display:flex;gap:8px;flex-wrap:wrap;">
             <button class="btn" id="btnRepetir">Repetir llamado</button>
             <select id="selTransfer" style="width:auto;">${SERVICIOS.filter(s=>s.id!==actual.servicioId).map(s=>`<option value="${s.id}">${s.nombre}</option>`).join('')}</select>
             <button class="btn" id="btnTransferir">Transferir</button>
             <button class="btn primary" id="btnFinalizar">Finalizar atención</button>
             <button class="btn" id="btnAusente" style="color:var(--cancel);border-color:var(--cancel);">Marcar ausente</button>
           </div>`
        : `<p style="color:var(--gray-mid);font-size:13px;">Sin turno en atención.</p>
           <button class="btn primary" id="btnSiguiente">Llamar siguiente turno</button>`
      }
      <div style="margin-top:16px;"><button class="btn ghost sm" id="btnLogout">Cerrar sesión</button></div>
    </div>
    <div class="section-title">Cola de mis servicios (${session.servicios.join(', ')})</div>
    <div class="card"><table><thead><tr><th>Código</th><th>Servicio</th><th>Espera</th></tr></thead><tbody>
      ${state.tickets.filter(t=>t.estado==='esperando' && session.servicios.includes(t.servicioId))
        .sort((a,b)=>a.createdAt-b.createdAt)
        .map(t=>`<tr><td class="mono">${t.codigo}</td><td>${svcOf(t.servicioId).nombre}</td><td>${Math.round((Date.now()-t.createdAt)/60000)} min</td></tr>`).join('')
        || `<tr><td colspan="3" class="empty">No hay turnos en espera</td></tr>`}
    </tbody></table></div>
  `;

  document.getElementById('btnLogout').onclick = ()=>{ session=null; body.parentElement.querySelector('.sub').textContent = SUCURSAL; renderAgentes(body); };

  const btnSig = document.getElementById('btnSiguiente');
  if(btnSig) btnSig.onclick = async ()=>{
    const t = siguienteEnEspera(session.servicios);
    if(!t){ toast('No hay turnos en espera para sus servicios'); return; }
    t.estado='en_atencion'; t.calledAt=Date.now(); t.ventanilla=session.ventanilla; t.agente=session.agentId; t.veces++;
    pushCalled(t);
    await saveState();
    renderAgentes(body);
  };
  const btnRep = document.getElementById('btnRepetir');
  if(btnRep) btnRep.onclick = async ()=>{ actual.veces++; pushCalled(actual); await saveState(); toast('Llamado repetido'); };
  const btnTrans = document.getElementById('btnTransferir');
  if(btnTrans) btnTrans.onclick = async ()=>{
    const nuevo = document.getElementById('selTransfer').value;
    actual.servicioId = nuevo; actual.estado='esperando'; actual.ventanilla=null; actual.agente=null;
    await saveState(); renderAgentes(body);
  };
  const btnFin = document.getElementById('btnFinalizar');
  if(btnFin) btnFin.onclick = async ()=>{ actual.estado='atendido'; actual.finishedAt=Date.now(); await saveState(); renderAgentes(body); };
  const btnAus = document.getElementById('btnAusente');
  if(btnAus) btnAus.onclick = async ()=>{ actual.estado='ausente'; actual.finishedAt=Date.now(); await saveState(); renderAgentes(body); };
}
function pushCalled(t){
  state.calledLog.unshift({ codigo:t.codigo, ventanilla:t.ventanilla, servicioId:t.servicioId, at:Date.now() });
  state.calledLog = state.calledLog.slice(0,10);
}

/* ---------------------- PANTALLA PÚBLICA ---------------------- */
function renderPublica(){
  root.innerHTML = `
    <div class="public">
      <button class="btn ghost sm exit-corner" id="exitPublica" style="color:#fff;">Salir</button>
      <div class="public-top"><div class="logo">CLARO</div><div class="clock2 mono" id="clock2"></div></div>
      <div class="public-grid" id="publicGrid"></div>
    </div>`;
  document.getElementById('exitPublica').onclick = ()=>{ currentView='recepcion'; render(); };
  tickClock('clock2');
  paintPublic();
  lastCalledSeen = state.calledLog.length ? state.calledLog[0].at : 0;
}
function paintPublic(){
  const grid = document.getElementById('publicGrid');
  if(!grid) return;
  if(!state.calledLog.length){
    grid.innerHTML = `<div class="public-empty">Aún no se han llamado turnos</div>`;
    return;
  }
  grid.innerHTML = state.calledLog.map((c,i)=>`
    <div class="call-card ${i===0?'latest':''}">
      <div class="code mono">${c.codigo}</div>
      <div class="win"><div class="n">${c.ventanilla}</div><div class="l">Ventanilla</div></div>
    </div>`).join('');
}
function anunciar(codigo, ventanilla){
  try{
    const texto = `Turno ${codigo.replace('-',' ')}, pasar a ventanilla ${ventanilla}`;
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES'; u.rate = 0.95;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------------- ADMIN ---------------------- */
function renderAdmin(body){
  body.innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:22px;">
      <div class="stat"><div class="v">${state.tickets.length}</div><div class="l">Turnos generados hoy</div></div>
      <div class="stat"><div class="v">${state.tickets.filter(t=>t.estado==='atendido').length}</div><div class="l">Atendidos</div></div>
      <div class="stat"><div class="v">${state.tickets.filter(t=>t.estado==='ausente').length}</div><div class="l">Ausentes</div></div>
      <div class="stat"><div class="v">${agents.length}</div><div class="l">Agentes activos</div></div>
    </div>

    <div class="section-title" style="margin-top:0;">Gestión de usuarios (agentes)</div>
    <div class="card" style="padding:14px;">
      <table><thead><tr><th>Nombre</th><th>Usuario</th><th>Servicios asignados</th><th></th></tr></thead>
      <tbody id="agentsTbody">
        ${agents.map(a=>`<tr><td>${a.nombre}</td><td class="mono">${a.usuario}</td><td>${a.servicios.join(', ')}</td>
          <td><button class="btn sm ghost" data-del="${a.id}" style="color:var(--cancel);">Eliminar</button></td></tr>`).join('')}
      </tbody></table>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:end;">
        <div><label>Nombre</label><input id="newAgentName" style="width:180px;"/></div>
        <div><label>Usuario</label><input id="newAgentUser" style="width:140px;"/></div>
        <div><label>Servicios</label>
          <select id="newAgentSvc" multiple style="width:200px;height:70px;">
            ${SERVICIOS.map(s=>`<option value="${s.id}">${s.id} — ${s.nombre}</option>`).join('')}
          </select>
        </div>
        <button class="btn primary" id="btnAddAgent">Agregar agente</button>
      </div>
    </div>

    <div class="section-title">Gestión de servicios y prefijos</div>
    <div class="card"><table><thead><tr><th>Prefijo</th><th>Servicio</th><th>Turnos generados hoy</th></tr></thead><tbody>
      ${SERVICIOS.map(s=>`<tr><td class="mono"><strong>${s.id}</strong></td><td>${s.nombre}</td><td>${state.counters[s.id]||0}</td></tr>`).join('')}
    </tbody></table></div>

    <div class="section-title">Configuración de impresoras térmicas</div>
    <div class="card" style="padding:16px;display:flex;gap:24px;flex-wrap:wrap;">
      <div><label>Kiosco</label><input value="KIOSCO-01" disabled/></div>
      <div><label>Conexión</label><input value="IP 192.168.1.50 : 9100" disabled/></div>
      <div><label>Ancho de papel</label><input value="58 mm" disabled/></div>
      <div><label>Estado</label><span class="badge attend" style="margin-top:8px;"><span class="dot"></span>En línea</span></div>
    </div>

    <div class="section-title">Sucursales</div>
    <div class="card"><table><thead><tr><th>Código</th><th>Nombre</th><th>Ventanillas</th></tr></thead><tbody>
      <tr><td class="mono">SUC-001</td><td>${SUCURSAL}</td><td>4</td></tr>
    </tbody></table></div>

    <div class="section-title">Reportes</div>
    <div class="card" style="padding:16px;">
      <table><thead><tr><th>Agente</th><th>Atendidos</th><th>T. prom. atención</th><th>Ausentes</th></tr></thead><tbody>
        ${agents.map(a=>{
          const propios = state.tickets.filter(t=>t.agente===a.id);
          const atendidos = propios.filter(t=>t.estado==='atendido');
          const ausentes = propios.filter(t=>t.estado==='ausente').length;
          const prom = atendidos.length ? (atendidos.reduce((s,t)=>s+(t.finishedAt-t.calledAt),0)/atendidos.length/60000) : 0;
          return `<tr><td>${a.nombre}</td><td>${atendidos.length}</td><td>${prom? prom.toFixed(1)+' min':'—'}</td><td>${ausentes}</td></tr>`;
        }).join('')}
      </tbody></table>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button class="btn sm">Exportar a Excel</button>
        <button class="btn sm">Exportar a PDF</button>
      </div>
      <p style="font-size:12px;color:var(--gray-mid);margin-top:10px;">
        La exportación real se implementa en el backend con ClosedXML (Excel) y QuestPDF (PDF) — ver documento de arquitectura.
      </p>
    </div>
  `;

  document.getElementById('btnAddAgent').onclick = async ()=>{
    const nombre = document.getElementById('newAgentName').value.trim();
    const usuario = document.getElementById('newAgentUser').value.trim();
    const sel = [...document.getElementById('newAgentSvc').selectedOptions].map(o=>o.value);
    if(!nombre || !usuario || !sel.length){ toast('Complete nombre, usuario y al menos un servicio'); return; }
    agents.push({ id: Date.now(), nombre, usuario, servicios: sel });
    await saveAgents();
    renderAdmin(body);
  };
  body.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      agents = agents.filter(a=>a.id != btn.dataset.del);
      await saveAgents();
      renderAdmin(body);
    };
  });
}

/* ---------------------- toast ---------------------- */
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------------------- polling (simula tiempo real) ---------------------- */
async function pollLoop(){
  await loadState();
  if(currentView==='publica'){
    paintPublic();
    tickClock('clock2');
    if(state.calledLog.length && state.calledLog[0].at > lastCalledSeen){
      lastCalledSeen = state.calledLog[0].at;
      anunciar(state.calledLog[0].codigo, state.calledLog[0].ventanilla);
    }
  } else if(currentView==='recepcion'){
    const body = document.getElementById('viewBody');
    if(body) body.innerHTML = recepcionHtml();
    tickClock('clockTop');
  }
}
setInterval(pollLoop, 3000);

/* ---------------------- icons (outline, stroke=currentColor) ---------------------- */
function svgWrap(inner){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`; }
function iconGrid(){ return svgWrap('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'); }
